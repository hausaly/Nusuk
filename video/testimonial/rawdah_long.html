<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hausaly EduTravels - Rawdah Visit Long Ad, Nov and Dec 2026 (TikTok overlay)</title>
<style>
  :root{ --teal:#68C8C7; --teal-deep:#1F7F7E; --teal-dark:#14605F; --teal-tint:#E6F6F6; --tan:#9C7648; --tan-soft:#C9A878; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:'Inter',sans-serif}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent}
  .abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
  .shadow{text-shadow:0 4px 22px rgba(10,60,60,.6),0 1px 3px rgba(10,60,60,.5)}
  .orb{position:absolute;border-radius:50%;background:#fff;opacity:.09}

  /* over the footage */
  #scrimTop{position:absolute;left:0;top:0;width:1080px;height:480px;background:linear-gradient(rgba(14,84,83,.72),rgba(14,84,83,.4) 55%,rgba(14,84,83,0))}
  #scrimBot{position:absolute;left:0;bottom:0;width:1080px;height:980px;background:linear-gradient(rgba(14,84,83,0),rgba(14,84,83,.62) 40%,rgba(14,84,83,.9))}
  #logo{top:64px;display:flex;justify-content:center}#logo img{height:104px;filter:drop-shadow(0 2px 8px rgba(10,60,60,.4))}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  .beat{position:absolute;left:0;width:1080px;bottom:250px;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:opacity}
  .beat>div{will-change:transform,opacity;text-align:center;color:#fff;text-shadow:0 4px 22px rgba(10,60,60,.6),0 1px 3px rgba(10,60,60,.5)}
  .ln-pill span{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:60px;padding:14px 44px;font-weight:900;font-size:38px;letter-spacing:7px;text-shadow:none}
  .ln-chip span{display:inline-block;background:var(--tan);color:#fff;border-radius:18px;padding:16px 38px;font-weight:900;font-size:42px;letter-spacing:4px;box-shadow:0 12px 34px rgba(10,60,60,.4);text-shadow:none;margin-top:14px}
  .ln-xl{font-size:230px;font-weight:900;letter-spacing:-9px;line-height:.95}
  .ln-l{font-size:140px;font-weight:900;letter-spacing:-6px;line-height:1}
  .ln-m{font-size:120px;font-weight:900;letter-spacing:-4px;line-height:1}
  .ln-sub{font-size:36px;font-weight:700;letter-spacing:7px;margin-top:10px}
  .ln-price span{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:60px;padding:20px 60px 34px;font-size:200px;font-weight:900;letter-spacing:-8px;line-height:1;box-shadow:0 24px 56px rgba(10,60,60,.35);text-shadow:none;min-width:620px}

  .scene{position:absolute;inset:0;visibility:hidden;overflow:hidden;will-change:transform}
  .scene.teal{background:var(--teal);color:#fff}
  .scene.white{background:#fff;color:var(--teal-deep)}
  .pill2{display:inline-block;border:3px solid #fff;border-radius:60px;padding:14px 44px;font-weight:800;font-size:38px;letter-spacing:7px}
  .band{position:absolute;left:0;top:0;width:1080px;height:420px}
  .band-logo{top:62px;display:flex;justify-content:center}.band-logo img{height:84px}
  .h-title{top:178px;color:#fff;font-weight:900;font-size:90px;letter-spacing:-2px;line-height:1}
  .h-sub{top:296px;color:#fff;font-weight:600;font-size:36px;opacity:.95}

  /* group cards */
  .gc{position:absolute;left:60px;width:900px;height:450px;border-radius:50px;background:var(--teal-tint);color:var(--teal-dark);will-change:transform,opacity}
  .gc .tag{position:absolute;left:44px;top:-24px;background:var(--teal-deep);color:#fff;border-radius:34px;padding:12px 30px;font-size:30px;font-weight:900;letter-spacing:4px}
  .gc.dec .tag{background:var(--tan)}
  .gc .col{position:absolute;top:84px}
  .gc .col small{display:block;font-size:30px;font-weight:800;letter-spacing:6px;color:var(--tan)}
  .gc .col b{display:block;font-size:190px;font-weight:900;letter-spacing:-8px;line-height:1;margin-top:10px;color:var(--teal-dark)}
  .gc .col i{display:block;font-style:normal;font-size:36px;font-weight:900;letter-spacing:2px;color:var(--teal-deep);margin-top:4px}
  .gc .l{left:50px}.gc .r{left:500px}
  .gc .plane{position:absolute;left:408px;top:150px;width:64px;height:64px}
  .gc .plane svg{width:64px;height:64px;fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .gc.dec .plane svg{stroke:var(--tan)}
  .gc .strip{position:absolute;left:50px;right:50px;bottom:44px;height:10px;border-radius:5px;background:rgba(31,127,126,.15);overflow:hidden}
  .gc .strip i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left;border-radius:5px}
  .gc.dec .strip i{background:var(--tan)}

  /* price */
  #s3 .a{top:620px;font-size:46px;font-weight:800;letter-spacing:12px}
  #s3 .b{top:720px;display:flex;justify-content:center}
  #s3 .b span{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:60px;padding:26px 70px 40px;font-size:230px;font-weight:900;letter-spacing:-8px;line-height:1;box-shadow:0 26px 60px rgba(20,96,95,.3);min-width:640px}
  #s3 .c{top:1090px;font-size:124px;font-weight:900;letter-spacing:-3px}
  #s3 .d{top:1260px;font-size:44px;font-weight:700;opacity:.95}

  /* 14 days */
  #big{top:450px;font-size:330px;font-weight:900;letter-spacing:-14px;line-height:1;color:var(--teal-deep)}
  #bigl{top:775px;font-size:44px;font-weight:900;letter-spacing:12px;color:var(--tan)}
  #bar{position:absolute;left:96px;top:880px;width:888px;height:120px}
  #bar .blk{position:absolute;top:0;width:56px;height:120px;border-radius:16px;background:var(--teal);color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
  #bar .blk.mk{background:var(--tan)}
  .pl{top:1130px;display:flex;justify-content:center}
  .pl.pm{left:-250px}.pl.pk2{left:250px}
  .pl span{display:inline-block;color:#fff;font-weight:900;font-size:64px;letter-spacing:4px;padding:26px 56px;border-radius:70px}
  .pl.pm span{background:var(--teal-deep)}.pl.pk2 span{background:var(--tan)}
  .dts{top:1330px;font-size:44px;font-weight:800;color:var(--teal-deep)}
  .sc{position:absolute;top:1060px;width:450px;height:400px;border-radius:44px;text-align:center;will-change:transform,opacity}
  .sc.m{left:60px;background:var(--teal-tint);color:var(--teal-deep)}
  .sc.k{left:540px;background:#F5ECE0;color:var(--tan)}
  .sc b{display:block;font-size:230px;font-weight:900;letter-spacing:-8px;line-height:1;margin-top:26px}
  .sc small{display:block;font-size:36px;font-weight:900;letter-spacing:5px;margin-top:6px}

  /* inclusions + ports */
  #s5 .lab{font-size:36px;font-weight:800;letter-spacing:10px}
  #s5 .a{top:330px}
  .tile{position:absolute;width:435px;height:300px;border-radius:40px;background:#fff;color:var(--teal-dark);text-align:center;box-shadow:0 18px 44px rgba(20,96,95,.25);will-change:transform,opacity}
  .tile .ic{width:130px;height:130px;border-radius:50%;background:var(--teal);margin:40px auto 0;display:flex;align-items:center;justify-content:center}
  .tile svg{width:70px;height:70px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tile p{margin-top:22px;font-size:46px;font-weight:900;letter-spacing:-.5px}
  #s5 .b{top:1090px}
  #ports{top:1160px;display:flex;justify-content:center;gap:20px}
  #ports span{display:inline-block;background:#fff;color:var(--teal-deep);font-weight:900;font-size:56px;letter-spacing:2px;padding:22px 42px;border-radius:56px;box-shadow:0 14px 34px rgba(20,96,95,.25)}
  #urg{top:1380px;display:flex;justify-content:center}
  #urg span{display:inline-block;background:var(--tan);color:#fff;border-radius:60px;padding:26px 56px;font-size:52px;font-weight:900;letter-spacing:-.5px;box-shadow:0 16px 40px rgba(20,96,95,.3)}

  /* contact */
  #s6 .logo2{top:130px;display:flex;justify-content:center}#s6 .logo2 img{height:190px}
  #q1{top:390px;display:flex;justify-content:center}
  #card{position:absolute;left:60px;width:900px;top:520px;height:730px;border-radius:54px;background:#fff;color:var(--teal-dark);box-shadow:0 24px 60px rgba(20,96,95,.3)}
  .crow{position:absolute;left:44px;right:36px;display:flex;align-items:center;gap:32px;text-align:left}
  .crow .ic{flex:0 0 104px;height:104px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .crow .ic svg{width:54px;height:54px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .crow small{display:block;font-size:26px;font-weight:800;letter-spacing:5px;color:var(--tan);margin-bottom:6px}
  .crow .v{font-weight:900;line-height:1.18;color:var(--teal-dark)}
  #c1{top:62px}#c1 .v{font-size:60px}#c2{top:292px}#c2 .v{font-size:50px}#c3{top:522px}#c3 .v{font-size:38px;font-weight:800}
  #q2{top:1340px;font-size:52px;font-weight:900}
  #q3{top:1420px;font-size:29px;font-weight:700;letter-spacing:4px;opacity:.9}
  #fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const T={s2:32.8,s3:38.6,s4:43.6,s5:48.6,s6:55.0,end:63.0};
window.RAWDAH_DURATION=T.end;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const outCubic=p=>1-Math.pow(1-p,3);
const outBack=p=>{const c=1.70158,k=c+1;return 1+k*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const stage=document.getElementById('stage');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const ICON={
  visa:'<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="10" r="3.6"/><path d="M8.4 10h7.2M12 6.4c-1.6 1.9-1.6 5.3 0 7.2M12 6.4c1.6 1.9 1.6 5.3 0 7.2M8 17.5h8"/>',
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  bed:'<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M12 4v6M2 18h20"/>',
  bus:'<path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3M9 18h5"/><circle cx="7" cy="18" r="2"/><circle cx="16" cy="18" r="2"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;

/* ---------- footage layer: scrims, logo, kinetic captions ---------- */
const BEATS=[
 {a:.25,b:2.1,lines:[['pill','UMRAH 2026'],['l','YOUR UMRAH'],['l','JOURNEY'],['chip','NOV &amp; DEC 2026 GROUPS']]},
 {a:2.5,b:4.2,lines:[['xl','STEP BY'],['xl','STEP']]},
 {a:4.6,b:6.3,lines:[['xl','SIDE BY'],['xl','SIDE']]},
 {a:6.7,b:8.4,lines:[['l','TOGETHER'],['l','IN FAITH']]},
 {a:8.8,b:12.6,lines:[['pill','HAUSALY EDUTRAVELS LTD'],['m','A JOURNEY'],['m','OF FAITH']]},
 {a:13.2,b:18.6,lines:[['m','MOMENTS'],['m','TO REMEMBER'],['sub','UMRAH 2026']]},
 {a:19.2,b:23.2,lines:[['l','PEACE'],['l','IN PRAYER']]},
 {a:23.8,b:27.7,lines:[['m','VISA'],['m','FLIGHTS'],['m','HOTEL'],['m','TRANSPORT'],['sub','ALL IN ONE PACKAGE']]},
 {a:28.2,b:32.4,lines:[['l','YOUR'],['xl','TURN.'],['chip','NOV &amp; DEC 2026 GROUPS']]}];
const hook=el(`<div id="hook"><div id="scrimTop"></div><div id="scrimBot"></div>
  <div id="logo" class="abs"><img src="assets/logo_white.png" alt="Hausaly EduTravels"></div><div id="beats"></div></div>`);
stage.appendChild(hook);
const $=s=>document.querySelector(s);
const beatEls=BEATS.map(b=>{const c=document.createElement('div');c.className='beat';
  const ls=b.lines.map(([k,t])=>{const d=document.createElement('div');d.className='ln-'+k;d.innerHTML=(k==='pill'||k==='chip'||k==='price')?`<span>${t}</span>`:t;c.appendChild(d);return d;});
  $('#beats').appendChild(c);return {c,ls,b};});

/* ---------- scenes ---------- */
const scenes=[];
function scene(id,cls,start,build){const s=el(`<div class="scene ${cls}" id="${id}"></div>`);stage.appendChild(s);scenes.push({s,start});build(s);return s;}
const orbs=s=>{s.appendChild(el('<div class="orb" style="width:760px;height:760px;left:-300px;top:-330px"></div>'));s.appendChild(el('<div class="orb" style="width:560px;height:560px;right:-240px;bottom:140px"></div>'));};
const band=(s,title,sub)=>{
  s.appendChild(el(`<svg class="band" viewBox="0 0 1080 420"><path fill="#68C8C7" d="M0 0H1080V330C760 450 330 270 0 360Z"/></svg>`));
  const lg=el('<div class="abs band-logo"><img src="assets/logo_white.png"></div>'),t=el(`<div class="abs h-title">${title}</div>`),u=el(`<div class="abs h-sub">${sub}</div>`);
  [lg,t,u].forEach(x=>s.appendChild(x)); return {lg,t,u};
};
const rv=(e,L,a,d=.5,dy=34)=>{const p=outCubic(prog(L,a,d));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*dy}px)`;};
const pop=(e,L,a,d=.5,from=.6,extra='')=>{const p=outBack(prog(L,a,d));e.style.opacity=clamp(p*2);e.style.transform=`scale(${from+(1-from)*p}) ${extra}`;};

let S2={},S3={},S4={},S5={},S6={};
scene('s2','white',T.s2,s=>{
  S2.h=band(s,'Group Packages','Departing 10 Nov &amp; 10 Dec 2026');
  const mk=(cls,top,tag,d1,d2,mon)=>el(`<div class="gc ${cls}" style="top:${top}px"><div class="tag">${tag}</div>
    <div class="col l"><small>DEPARTURE</small><b>${d1}</b><i>${mon} 2026</i></div>
    <div class="plane"><svg viewBox="0 0 24 24">${ICON.plane}</svg></div>
    <div class="col r"><small>RETURN · JEDDAH</small><b>${d2}</b><i>${mon} 2026</i></div>
    <div class="strip"><i></i></div></div>`);
  S2.n=mk('nov',520,'NOVEMBER 2026 GROUP PACKAGE','10','24','NOVEMBER'); S2.d=mk('dec',1090,'DECEMBER 2026 GROUP PACKAGE','10','24','DECEMBER');
  s.appendChild(S2.n);s.appendChild(S2.d);
});
scene('s3','teal',T.s3,s=>{orbs(s);
  S3.a=el('<div class="abs a">PRICE</div>');S3.bw=el('<div class="abs b"><span id="pv">₦0.0M</span></div>');S3.c=el('<div class="abs c">ECONOMY</div>');S3.d=el('<div class="abs d">Group Package · November &amp; December 2026</div>');
  [S3.a,S3.bw,S3.c,S3.d].forEach(x=>s.appendChild(x));
});
scene('s4','white',T.s4,s=>{
  S4.h=band(s,'14 Days Journey','Umrah in Madinah &amp; Makkah');
  S4.big=el('<div class="abs" id="big">1</div>');S4.bl=el('<div class="abs" id="bigl">TOTAL DAYS</div>');
  s.appendChild(S4.big);s.appendChild(S4.bl);
  S4.bar=el('<div id="bar"></div>');s.appendChild(S4.bar);
  S4.blks=[];for(let i=0;i<14;i++){const b=el(`<div class="blk" style="left:${i*64}px">${i+1}</div>`);S4.bar.appendChild(b);S4.blks.push(b);}
  S4.pm=el('<div class="abs pl pm"><span>MADINAH</span></div>');S4.pk=el('<div class="abs pl pk2"><span>MAKKAH</span></div>');S4.dt=el('<div class="abs dts">10 NOV – 24 NOV &nbsp;·&nbsp; 10 DEC – 24 DEC</div>');
  [S4.pm,S4.pk,S4.dt].forEach(x=>s.appendChild(x));
});
scene('s5','teal',T.s5,s=>{orbs(s);
  S5.a=el('<div class="abs lab a">PACKAGE INCLUDES</div>');s.appendChild(S5.a);
  S5.t=[['visa','Visa'],['plane','Flights'],['bed','Hotel'],['bus','Transport']].map(([k,l],i)=>{
    const t=el(`<div class="tile" style="left:${60+(i%2)*465}px;top:${400+Math.floor(i/2)*330}px"><div class="ic">${svg(k)}</div><p>${l}</p></div>`);s.appendChild(t);return t;});
  S5.b=el('<div class="abs lab b">DEPARTURE PORTS</div>');S5.p=el('<div class="abs" id="ports"><span>KANO</span><span>ABUJA</span><span>LAGOS</span></div>');
  S5.u=el('<div class="abs" id="urg"><span>Slots are limited. Book early!</span></div>');
  [S5.b,S5.p,S5.u].forEach(x=>s.appendChild(x));
});
scene('s6','teal',T.s6,s=>{orbs(s);
  S6.lg=el('<div class="abs logo2"><img src="assets/logo_white.png"></div>');S6.q1=el('<div class="abs" id="q1"><span class="pill2">NOV &amp; DEC 2026 · ₦2.5M</span></div>');
  S6.card=el(`<div id="card">
    <div class="crow" id="c1"><div class="ic">${svg('phone')}</div><div><small>CONTACT</small><div class="v">+234 813 122 7047</div></div></div>
    <div class="crow" id="c2"><div class="ic">${svg('mail')}</div><div><small>EMAIL</small><div class="v">contact@hausaly.com</div></div></div>
    <div class="crow" id="c3"><div class="ic">${svg('pin')}</div><div><small>OFFICE</small><div class="v">Bosso Plaza, Along Gombe Road,<br>Biu, Borno, Nigeria</div></div></div></div>`);
  S6.q2=el('<div class="abs" id="q2">Hausaly EduTravels Ltd.</div>');S6.q3=el('<div class="abs" id="q3">IATA No: 96200801 &nbsp;·&nbsp; RC: 8334167</div>');
  [S6.lg,S6.q1,S6.card,S6.q2,S6.q3].forEach(x=>s.appendChild(x));
});
const fade=el('<div id="fade"></div>');stage.appendChild(fade);

function render(t){
  /* footage layer */
  const foot=1-outCubic(prog(t,T.s2,.45));
  hook.style.display=t<T.s2+.6?'block':'none';
  $('#scrimTop').style.opacity=foot*clamp(prog(t,0,.4));$('#scrimBot').style.opacity=foot*clamp(prog(t,0,.5));
  const lp=outCubic(prog(t,.1,.5));$('#logo').style.opacity=foot*lp;$('#logo').style.transform=`translateY(${(1-lp)*-24}px)`;
  beatEls.forEach(({c,ls,b})=>{
    const pout=prog(t,b.b,.3); c.style.opacity=(1-pout)*foot; c.style.visibility=(t>=b.a&&t<b.b+.32)?'visible':'hidden';
    ls.forEach((d,i)=>{const p=outBack(prog(t,b.a+i*.1,.3)); d.style.opacity=clamp(p*3); d.style.transform=`scale(${1.3-.3*p}) translateY(${-pout*30}px)`;});
  });

  /* scene slide-in (whip) */
  scenes.forEach((x,i)=>{
    const next=scenes[i+1]?scenes[i+1].start+.5:Infinity;
    x.s.style.visibility=(t>=x.start&&t<next)?'visible':'hidden';
    x.s.style.transform=`translateX(${(1-outCubic(prog(t,x.start,.45)))*1080}px)`;
  });

  /* s2 */
  let L=t-T.s2;
  rv(S2.h.lg,L,.4,.5,20);rv(S2.h.t,L,.5,.6);rv(S2.h.u,L,.8,.6,20);
  const slideIn=(e,a,dir)=>{const p=outCubic(prog(L,a,.6));e.style.opacity=p;e.style.transform=`translateX(${dir*(1-p)*500}px)`;};
  slideIn(S2.n,1.0,-1);slideIn(S2.d,1.7,1);
  S2.n.querySelector('.strip i').style.transform=`scaleX(${outCubic(prog(L,1.6,1.2))})`;
  S2.d.querySelector('.strip i').style.transform=`scaleX(${outCubic(prog(L,2.3,1.2))})`;
  /* s3: count-up price */
  L=t-T.s3;
  rv(S3.a,L,.5,.4,20);
  const v=2.5*outCubic(prog(L,.7,1.1));document.getElementById('pv').textContent='₦'+v.toFixed(1)+'M';
  pop(S3.bw.firstChild,L,.6,.6,.55);
  S3.bw.style.transform=`scale(${1+.025*Math.sin(L*4)*clamp(prog(L,1.8,.3))})`;
  rv(S3.c,L,1.7,.5);rv(S3.d,L,2.2,.5,20);
  /* s4: 14 days */
  L=t-T.s4;
  rv(S4.h.lg,L,.3,.5,20);rv(S4.h.t,L,.4,.6);rv(S4.h.u,L,.7,.6,20);
  const day=Math.max(1,Math.round(1+13*outCubic(prog(L,.6,1.9))));S4.big.textContent=day;
  rv(S4.big,L,.5,.4,24);rv(S4.bl,L,.8,.5,16);
  S4.blks.forEach((b,i)=>{const p=outBack(prog(L,.8+i*.14,.3));b.style.opacity=clamp(p*2);b.style.transform=`translateY(${(1-p)*40}px) scale(${.6+.4*p})`;});
  pop(S4.pm.firstChild,L,1.7,.55,.7);pop(S4.pk.firstChild,L,2.3,.55,.7);rv(S4.dt,L,3.0,.5,20);
  /* s5 */
  L=t-T.s5;
  rv(S5.a,L,.3,.5,20);S5.t.forEach((e,i)=>pop(e,L,.5+i*.3,.5,.6));
  rv(S5.b,L,2.0,.5,20);rv(S5.p,L,2.3,.6);
  pop(S5.u.firstChild,L,3.0,.6,.7);S5.u.style.transform=`scale(${1+.03*Math.sin(L*6)*clamp(prog(L,3.5,.2))})`;
  /* s6 */
  L=t-T.s6;
  rv(S6.lg,L,.1,.6);rv(S6.q1,L,.4,.6);pop(S6.card,L,.7,.8,.94,'');
  ['#c1','#c2','#c3'].forEach((q,i)=>{const e=S6.card.querySelector(q),p=outCubic(prog(L,1.2+i*.5,.5));e.style.opacity=p;e.style.transform=`translateX(${-(1-p)*60}px)`;});
  rv(S6.q2,L,2.7,.6,20);rv(S6.q3,L,3.0,.6,14);
  const pv=S6.card.querySelector('#c1 .v');pv.style.transformOrigin='left center';pv.style.transform=`scale(${1+.05*Math.sin(prog(L,3.4,2.2)*Math.PI)})`;
  fade.style.opacity=clamp((t-(T.end-.5))/.5);
}
