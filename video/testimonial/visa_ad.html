<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hausaly EduTravels - Umrah Visa Ad, Multiple Entry (TikTok 1080x1920)</title>
<style>
  :root{ --teal:#68C8C7; --teal-deep:#1F7F7E; --teal-dark:#14605F; --teal-tint:#E6F6F6; --tan:#9C7648; --tan-soft:#C9A878; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--teal);font-family:'Inter',sans-serif}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  .scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
  .scene.teal{background:var(--teal);color:#fff}
  .scene.white{background:#fff;color:var(--teal-deep)}
  .abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
  .orb{position:absolute;border-radius:50%;background:#fff;opacity:.09}
  .logo{display:flex;justify-content:center}.logo img{display:block}
  .pill{display:inline-block;border:3px solid #fff;border-radius:60px;padding:14px 44px;font-weight:800;font-size:38px;letter-spacing:7px}

  .band{position:absolute;left:0;top:0;width:1080px;height:420px}
  .band-logo{top:62px}.band-logo img{height:84px}
  .h-title{top:178px;color:#fff;font-weight:900;font-size:90px;letter-spacing:-2px;line-height:1}
  .h-sub{top:296px;color:#fff;font-weight:600;font-size:36px;opacity:.95}

  /* 1 hook */
  #s1 .logo{top:110px}#s1 .logo img{height:180px}
  #s1 .k1{top:390px;font-size:250px;font-weight:900;letter-spacing:-8px;line-height:1}
  #s1 .k2{top:630px;font-size:250px;font-weight:900;letter-spacing:-8px;line-height:1}
  #s1 .k3{top:935px;display:flex;justify-content:center}
  #s1 .hero{position:absolute;left:390px;top:1170px;width:300px;height:300px;border-radius:50%;background:#fff;box-shadow:0 24px 60px rgba(20,96,95,.35);display:flex;align-items:center;justify-content:center}
  #s1 .hero svg{width:170px;height:170px;fill:none;stroke:var(--teal-deep);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .star{position:absolute;width:30px;height:30px}

  /* 2 details */
  .dc{position:absolute;left:60px;width:900px;height:520px;border-radius:50px;background:var(--teal-tint);color:var(--teal-dark);will-change:transform,opacity}
  .dc .ic{position:absolute;left:54px;top:56px;width:160px;height:160px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .dc .ic svg{width:80px;height:80px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .dc small{position:absolute;left:54px;top:268px;font-size:32px;font-weight:800;letter-spacing:7px;color:var(--tan)}
  .dc b{position:absolute;left:54px;right:30px;top:322px;white-space:nowrap;font-weight:900;letter-spacing:-2px;line-height:1.05}
  #d1 b{font-size:78px;letter-spacing:-1.5px}
  #d2 b{font-size:150px}
  .dc .num{position:absolute;right:50px;top:60px;font-size:30px;font-weight:900;letter-spacing:4px;color:#fff;background:var(--tan);border-radius:30px;padding:10px 24px}

  /* 3 price */
  #s3 .a{top:650px;font-size:46px;font-weight:800;letter-spacing:12px}
  #s3 .b{top:750px;display:flex;justify-content:center}
  #s3 .b span{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:56px;padding:26px 56px 38px;font-size:176px;font-weight:900;letter-spacing:-6px;line-height:1;box-shadow:0 24px 56px rgba(20,96,95,.3)}
  #s3 .c{top:1100px;font-size:88px;font-weight:900;letter-spacing:-1px}
  #s3 .d{top:1260px;display:flex;justify-content:center;gap:18px}
  #s3 .d span{display:inline-block;border:3px solid #fff;border-radius:44px;padding:12px 28px;font-weight:800;font-size:36px;letter-spacing:2px}

  /* 4 contact */
  #s4 .logo{top:130px}#s4 .logo img{height:190px}
  #s4 .recap{top:390px;display:flex;justify-content:center}
  #s4 .card{position:absolute;left:60px;width:900px;top:520px;height:730px;border-radius:54px;background:#fff;color:var(--teal-dark);box-shadow:0 24px 60px rgba(20,96,95,.3)}
  .crow{position:absolute;left:44px;right:36px;display:flex;align-items:center;gap:32px;text-align:left}
  .crow .ic{flex:0 0 104px;height:104px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .crow .ic svg{width:54px;height:54px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .crow small{display:block;font-size:26px;font-weight:800;letter-spacing:5px;color:var(--tan);margin-bottom:6px}
  .crow .v{font-weight:900;line-height:1.18;color:var(--teal-dark)}
  #c1{top:62px}#c1 .v{font-size:60px}#c2{top:292px}#c2 .v{font-size:50px}#c3{top:522px}#c3 .v{font-size:38px;font-weight:800}
  #s4 .org{top:1340px;font-size:52px;font-weight:900}
  #s4 .iata{top:1420px;font-size:29px;font-weight:700;letter-spacing:4px;opacity:.9}
  #fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const T = {s1:0, s2:3.8, s3:9.4, s4:13.6, end:19.1};
window.AD_DURATION = T.end;

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const outCubic=p=>1-Math.pow(1-p,3);
const outBack=p=>{const c=1.70158,k=c+1;return 1+k*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const stage=document.getElementById('stage');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const ICON={
  visa:'<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="10" r="3.6"/><path d="M8.4 10h7.2M12 6.4c-1.6 1.9-1.6 5.3 0 7.2M12 6.4c1.6 1.9 1.6 5.3 0 7.2M8 17.5h8"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const scenes=[], anims=[], startOf={};
function scene(id,cls,start,build){const s=el(`<div class="scene ${cls}" id="${id}"></div>`);stage.appendChild(s);scenes.push({s,start});startOf[id]=start;build(s);}
function A(e,start,dur,kind='up',d=40){anims.push({e,start,dur,kind,d});}
const orbs=s=>{s.appendChild(el('<div class="orb" style="width:760px;height:760px;left:-300px;top:-330px"></div>'));s.appendChild(el('<div class="orb" style="width:560px;height:560px;right:-240px;bottom:140px"></div>'));};
const band=(s,title,sub)=>{
  s.appendChild(el(`<svg class="band" viewBox="0 0 1080 420"><path fill="#68C8C7" d="M0 0H1080V330C760 450 330 270 0 360Z"/></svg>`));
  const lg=el('<div class="abs logo band-logo"><img src="assets/logo_white.png"></div>'),t=el(`<div class="abs h-title">${title}</div>`),u=el(`<div class="abs h-sub">${sub}</div>`);
  [lg,t,u].forEach(x=>s.appendChild(x)); A(lg,.1,.5,'fade',20);A(t,.2,.6);A(u,.5,.6,'fade',20);
};

/* 1 hook */
scene('s1','teal',T.s1,s=>{
  orbs(s);
  const lg=el('<div class="abs logo"><img src="assets/logo_white.png"></div>'),k1=el('<div class="abs k1">UMRAH</div>'),k2=el('<div class="abs k2">VISA</div>'),
        k3=el('<div class="abs k3"><span class="pill">MULTIPLE ENTRY</span></div>'),hero=el(`<div class="hero">${svg('visa')}</div>`);
  [lg,k1,k2,k3,hero].forEach(x=>s.appendChild(x));
  const st=[[190,1130,1],[850,1210,.8],[250,1500,.7],[800,1530,1],[540,1110,.6],[70,330,.6],[980,560,.8]].map(([x,y,sc],i)=>{
    const e=el(`<svg class="star" viewBox="0 0 24 24" style="left:${x}px;top:${y}px"><path fill="#fff" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>`);s.appendChild(e);e._sc=sc;e._i=i;return e;});
  A(lg,.15,.7);A(k1,.4,.7,'pop');A(k2,.75,.7,'pop');A(k3,1.3,.6);
  anims.push({scene:'s1',custom:t=>{
    const p=outBack(prog(t,1.5,.8));hero.style.opacity=clamp(p*2);hero.style.transform=`translateY(${Math.sin(t*1.6)*10}px) scale(${.5+.5*p})`;
    st.forEach(e=>{const tw=.55+.45*Math.sin(t*3+e._i*1.7);e.style.opacity=clamp(prog(t,1.2+e._i*.12,.4))*tw;e.style.transform=`scale(${e._sc*(.8+.4*tw)}) rotate(${t*20}deg)`;});
  }});
});

/* 2 details */
scene('s2','white',T.s2,s=>{
  band(s,'Umrah Visa','For individuals and families'.replace('For individuals and families','Multiple Entry'));
  const c1=el(`<div class="dc" id="d1" style="top:470px"><div class="ic">${svg('visa')}</div><small>VISA TYPE</small><b>Multiple Entry Visa</b></div>`);
  const c2=el(`<div class="dc" id="d2" style="top:1030px"><div class="ic">${svg('clock')}</div><small>PROCESSING TIME</small><b>48 Hours</b></div>`);
  s.appendChild(c1);s.appendChild(c2);A(c1,.7,.7,'pop');A(c2,1.7,.7,'pop');
});

/* 3 price */
scene('s3','teal',T.s3,s=>{
  orbs(s);
  const a=el('<div class="abs a">PRICE</div>'),b=el('<div class="abs b"><span>₦700,000</span></div>'),c=el('<div class="abs c">Naira</div>'),
        d=el('<div class="abs d"><span>Multiple Entry</span><span>48 Hours</span></div>');
  [a,b,c,d].forEach(x=>s.appendChild(x));
  A(a,.2,.5,'fade',20);A(b.firstChild,.5,.8,'pop');A(c,1.2,.6);A(d,1.7,.6);
  anims.push({scene:'s3',custom:t=>{b.style.transform=`scale(${1+.025*Math.sin(t*4)})`;}});
});

/* 4 contact */
scene('s4','teal',T.s4,s=>{
  orbs(s);
  const lg=el('<div class="abs logo"><img src="assets/logo_white.png"></div>'),recap=el('<div class="abs recap"><span class="pill">UMRAH VISA · ₦700,000</span></div>'),
  card=el(`<div class="card">
    <div class="crow" id="c1"><div class="ic">${svg('phone')}</div><div><small>CONTACT</small><div class="v">+234 813 122 7047</div></div></div>
    <div class="crow" id="c2"><div class="ic">${svg('mail')}</div><div><small>EMAIL</small><div class="v">contact@hausaly.com</div></div></div>
    <div class="crow" id="c3"><div class="ic">${svg('pin')}</div><div><small>OFFICE</small><div class="v">Bosso Plaza, Along Gombe Road,<br>Biu, Borno, Nigeria</div></div></div></div>`),
  org=el('<div class="abs org">Hausaly EduTravels Ltd.</div>'),iata=el('<div class="abs iata">IATA No: 96200801 &nbsp;·&nbsp; RC: 8334167</div>');
  [lg,recap,card,org,iata].forEach(x=>s.appendChild(x));
  A(lg,.1,.7);A(recap,.4,.6);A(card,.7,.8,'pop');
  ['#c1','#c2','#c3'].forEach((q,i)=>A(card.querySelector(q),1.2+i*.5,.5,'left',60));
  A(org,2.7,.6);A(iata,3.0,.6,'fade',16);
  anims.push({scene:'s4',custom:t=>{const p=prog(t,3.4,2.0),v=card.querySelector('#c1 .v');v.style.transformOrigin='left center';v.style.transform=`scale(${1+.05*Math.sin(p*Math.PI)})`;}});
});

const fade=el('<div id="fade"></div>');stage.appendChild(fade);
function render(t){
  scenes.forEach((x,i)=>{const next=scenes[i+1]?scenes[i+1].start+.5:Infinity;x.s.style.visibility=(t>=x.start&&t<next)?'visible':'hidden';x.s.style.opacity=i===0?1:outCubic(prog(t,x.start,.5));});
  for(const a of anims){
    if(a.custom){a.custom(t-startOf[a.scene]);continue;}
    const lt=t-startOf[a.e.closest('.scene').id],p=prog(lt,a.start,a.dur),o=outCubic(p);
    a.e.style.opacity=p;
    if(a.kind==='up')a.e.style.transform=`translateY(${(1-o)*a.d}px)`;
    else if(a.kind==='left')a.e.style.transform=`translateX(${-(1-o)*a.d}px)`;
    else if(a.kind==='pop')a.e.style.transform=`scale(${.6+.4*outBack(p)})`;
    else a.e.style.transform='none';
  }
  fade.style.opacity=clamp((t-(T.end-.5))/.5);
}
window.render=render;
</script>
</body>
</html>
