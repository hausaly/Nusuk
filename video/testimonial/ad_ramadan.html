<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hausaly EduTravels - Umrah Ramadan 2027 Ad (TikTok 1080x1920)</title>
<style>
  :root{
    --teal:#68C8C7; --teal-deep:#1F7F7E; --teal-dark:#14605F; --teal-tint:#E6F6F6;
    --tan:#9C7648; --tan-soft:#C9A878;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--teal);font-family:'Inter',sans-serif}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  .scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
  .scene.teal{background:var(--teal);color:#fff}
  .scene.white{background:#fff;color:var(--teal-deep)}
  .abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
  .orb{position:absolute;border-radius:50%;background:#fff;opacity:.09}
  .logo{display:flex;justify-content:center}
  .logo img{display:block}

  /* white scenes: teal header band with curved bottom */
  .band{position:absolute;left:0;top:0;width:1080px;height:420px}
  .band-logo{top:62px}.band-logo img{height:84px}
  .h-title{top:178px;color:#fff;font-weight:900;font-size:84px;letter-spacing:-2px;line-height:1}
  .h-sub{top:290px;color:#fff;font-weight:600;font-size:34px;opacity:.95}

  /* scene 1 */
  #s1 .logo{top:110px}#s1 .logo img{height:180px}
  #s1 .k1{top:400px;font-size:250px;font-weight:900;letter-spacing:-6px;line-height:1}
  #s1 .k2{top:690px;font-size:120px;font-weight:900;letter-spacing:-2px;line-height:1}
  #s1 .k3{top:860px;display:flex;justify-content:center}
  #s1 .k3 span,.pill{display:inline-block;border:3px solid #fff;border-radius:60px;padding:14px 44px;font-weight:800;font-size:38px;letter-spacing:7px}
  #s1 .k4{top:1000px;padding:0 80px;font-size:56px;font-weight:500;line-height:1.38}
  #s1 .k4 b{font-weight:800}
  #crescent{position:absolute;left:390px;top:1380px;width:300px;height:300px}
  .star{position:absolute;width:30px;height:30px}

  /* packages */
  .pk{position:absolute;left:60px;width:900px;height:180px;border-radius:34px;background:var(--teal-tint);
      display:flex;align-items:center;padding:0 34px 0 40px;color:var(--teal-dark);will-change:transform,opacity}
  .pk .d{flex:1;min-width:0}
  .pk .d b{display:block;font-size:46px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .pk .d span{display:block;font-size:33px;font-weight:600;color:#3d8a89;margin-top:8px}
  .pk .p{flex:0 0 auto;border-radius:24px;padding:16px 28px;color:#fff;font-weight:900;font-size:58px;letter-spacing:-1px;background:var(--teal-deep)}
  .pk .p.hi{background:var(--tan)}
  .pk .stripe{position:absolute;left:0;top:22px;bottom:22px;width:9px;border-radius:5px;background:var(--teal)}

  /* deposit */
  #s3 .a{top:790px;font-size:68px;font-weight:600}
  #s3 .b{top:930px;display:flex;justify-content:center}
  #s3 .b span{display:inline-block;background:#fff;color:var(--teal-deep);border-radius:48px;padding:20px 54px 30px;font-size:166px;font-weight:900;letter-spacing:-6px;line-height:1;box-shadow:0 22px 50px rgba(20,96,95,.28)}
  #s3 .c{top:1280px;font-size:96px;font-weight:900;letter-spacing:-1px}
  
  /* inclusions */
  .inc{position:absolute;width:435px;height:385px;border-radius:36px;background:var(--teal-tint);text-align:center;color:var(--teal-dark);will-change:transform,opacity}
  .inc .ic{width:156px;height:156px;border-radius:50%;background:var(--teal);margin:50px auto 0;display:flex;align-items:center;justify-content:center}
  .inc svg{width:84px;height:84px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .inc p{margin:28px 24px 0;font-size:39px;font-weight:800;line-height:1.2;letter-spacing:-.3px}

  /* hotels */
  .tag{position:absolute;left:60px;border-radius:44px;background:var(--teal-deep);color:#fff;font-weight:900;font-size:44px;letter-spacing:7px;padding:14px 46px;will-change:transform,opacity}
  .tag.mk{background:var(--tan)}
  .ht{position:absolute;left:60px;width:900px;height:128px;border-radius:32px;background:var(--teal-tint);display:flex;align-items:center;gap:28px;padding:0 36px;color:var(--teal-dark);font-size:48px;font-weight:800;letter-spacing:-.4px;will-change:transform,opacity}
  .ht i{flex:0 0 78px;height:78px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .ht i svg{width:42px;height:42px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ht.mk i{background:var(--tan-soft)}

  /* departures */
  #s6 .a{top:330px;font-size:34px;font-weight:800;letter-spacing:9px}
  #s6 .cities{top:410px;display:flex;justify-content:center;gap:22px}
  #s6 .cities span{display:inline-block;background:#fff;color:var(--teal-deep);font-weight:900;font-size:50px;letter-spacing:2px;padding:20px 38px;border-radius:50px}
  #s6 .trail{position:absolute;left:0;top:560px;width:1080px;height:620px}
  #s6 .dest{top:1180px;font-size:150px;font-weight:900;letter-spacing:-3px;line-height:1}
  #s6 .dest small{display:block;font-size:34px;font-weight:700;letter-spacing:10px;margin-top:6px;opacity:.9}
  #s6 .urg{top:1470px;display:flex;justify-content:center}
  #s6 .urg span{display:inline-block;background:#fff;color:var(--teal-dark);border-radius:60px;padding:26px 56px;font-size:52px;font-weight:900;letter-spacing:-.5px;box-shadow:0 16px 40px rgba(20,96,95,.3)}
  #plane{position:absolute;left:0;top:0;width:90px;height:90px;margin:-45px 0 0 -45px;will-change:transform}
  #plane svg{width:90px;height:90px;fill:#fff}

  /* contact */
  #s7 .logo{top:130px}#s7 .logo img{height:190px}
  #s7 .recap{top:390px;display:flex;justify-content:center}
  #s7 .card{position:absolute;left:60px;width:900px;top:520px;height:730px;border-radius:54px;background:#fff;color:var(--teal-dark);box-shadow:0 24px 60px rgba(20,96,95,.3)}
  .crow{position:absolute;left:44px;right:36px;display:flex;align-items:center;gap:32px;text-align:left}
  .crow .ic{flex:0 0 104px;height:104px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .crow .ic svg{width:54px;height:54px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .crow small{display:block;font-size:26px;font-weight:800;letter-spacing:5px;color:var(--tan);margin-bottom:6px}
  .crow .v{font-weight:900;line-height:1.18;color:var(--teal-dark)}
  #c1{top:62px}#c1 .v{font-size:60px}
  #c2{top:292px}#c2 .v{font-size:50px}
  #c3{top:522px}#c3 .v{font-size:38px;font-weight:800}
  #s7 .org{top:1340px;font-size:52px;font-weight:900;letter-spacing:.5px}
  #s7 .iata{top:1420px;font-size:29px;font-weight:700;letter-spacing:4px;opacity:.9}
  #fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ---------- timeline ---------- */
const T = {s1:0, s2:4.4, s3:11.6, s4:15.0, s5:21.2, s6:27.4, s7:31.8, end:39.0};
window.AD_DURATION = T.end;

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const outCubic=p=>1-Math.pow(1-p,3);
const outBack=p=>{const c=1.70158,k=c+1;return 1+k*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const stage=document.getElementById('stage');
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;};
const ICON={
  visa:'<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="10" r="3.6"/><path d="M8.4 10h7.2M12 6.4c-1.6 1.9-1.6 5.3 0 7.2M12 6.4c1.6 1.9 1.6 5.3 0 7.2M8 17.5h8"/>',
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  bed:'<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M12 4v6M2 18h20"/>',
  bus:'<path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3M9 18h5"/><circle cx="7" cy="18" r="2"/><circle cx="16" cy="18" r="2"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'
};
const svg=(k,vb='0 0 24 24')=>`<svg viewBox="${vb}">${ICON[k]}</svg>`;

const scenes=[], anims=[];
function scene(id,cls,start,build){
  const s=el(`<div class="scene ${cls}" id="${id}"></div>`); stage.appendChild(s);
  scenes.push({s,start,idx:scenes.length}); build(s,start); return s;
}
/* animate child e: kind 'up' | 'left' | 'pop' | 'fade' | 'scaleX' */
function A(e,start,dur,kind='up',d=40){anims.push({e,start,dur,kind,d});}
const band=(s,title,sub)=>{
  s.appendChild(el(`<svg class="band" viewBox="0 0 1080 420"><path fill="#68C8C7" d="M0 0H1080V330C760 450 330 270 0 360Z"/></svg>`));
  const lg=el(`<div class="abs logo band-logo"><img src="assets/logo_white.png"></div>`); s.appendChild(lg);
  const t=el(`<div class="abs h-title">${title}</div>`); s.appendChild(t);
  const u=el(`<div class="abs h-sub">${sub}</div>`); s.appendChild(u);
  return {lg,t,u};
};
const orbs=s=>{s.appendChild(el('<div class="orb" style="width:760px;height:760px;left:-300px;top:-330px"></div>'));
               s.appendChild(el('<div class="orb" style="width:560px;height:560px;right:-240px;bottom:140px"></div>'));};

/* ---------- 1 hook ---------- */
scene('s1','teal',T.s1,(s,t0)=>{
  orbs(s);
  const lg=el('<div class="abs logo"><img src="assets/logo_white.png"></div>');
  const k1=el('<div class="abs k1">UMRAH</div>'), k2=el('<div class="abs k2">RAMADAN 2027</div>');
  const k3=el('<div class="abs k3"><span>COMPLETE PACKAGES</span></div>');
  const k4=el('<div class="abs k4">Spend the blessed days of Ramadan in the <b>Haramain</b> with <b>Hausaly EduTravels Ltd.</b></div>');
  [lg,k1,k2,k3,k4].forEach(x=>s.appendChild(x));
  // crescent + stars
  const cres=el(`<svg id="crescent" viewBox="0 0 150 150"><defs><mask id="cm"><rect width="150" height="150" fill="#fff"/><circle cx="102" cy="58" r="52" fill="#000"/></mask></defs><circle cx="70" cy="76" r="62" fill="#fff" mask="url(#cm)"/></svg>`);
  s.appendChild(cres);
  const st=[[170,1330,1],[830,1420,.8],[250,1620,.7],[780,1650,1],[540,1300,.6],[70,330,.6],[980,560,.8]].map(([x,y,sc],i)=>{
    const e=el(`<svg class="star" viewBox="0 0 24 24" style="left:${x}px;top:${y}px;transform-origin:center"><path fill="#fff" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>`);
    s.appendChild(e); e._sc=sc; e._i=i; return e;});
  A(lg,.15,.7); A(k1,.5,.7,'pop'); A(k2,.9,.7); A(k3,1.4,.6); A(k4,1.9,.8);
  anims.push({custom:t=>{
    const p=outBack(prog(t,.3,.9)); cres.style.opacity=clamp(p*2); cres.style.transform=`translateY(${Math.sin(t*1.4)*8}px) rotate(${-12+Math.sin(t*.9)*3}deg) scale(${.4+.6*p})`;
    st.forEach(e=>{const tw=.55+.45*Math.sin(t*3+e._i*1.7); e.style.opacity=clamp(prog(t,.6+e._i*.15,.4))*tw; e.style.transform=`scale(${e._sc*(.8+.4*tw)}) rotate(${t*20}deg)`;});
  },scene:'s1'});
});

/* ---------- 2 packages ---------- */
scene('s2','white',T.s2,(s,t0)=>{
  const h=band(s,'Choose Your Package','Choose the package that fits your schedule');
  A(h.lg,.1,.5,'fade',20);A(h.t,.2,.6);A(h.u,.5,.6,'fade',20);
  const rows=[['1 Ramadan – 28 Ramadan','4 weeks','₦4.7M',1],['1 Ramadan – 7 Shawwal','5 weeks, 2 days','₦4.7M',1],
    ['14 Ramadan – 3 Shawwal','2 weeks, 6 days','₦4.5M',0],['14 Ramadan – 7 Shawwal','3 weeks, 3 days','₦4.5M',0],
    ['20 Ramadan – 3 Shawwal','2 weeks','₦4.5M',0],['20 Ramadan – 7 Shawwal','2 weeks, 4 days','₦4.5M',0]];
  rows.forEach(([a,b,p,hi],i)=>{
    const r=el(`<div class="pk" style="top:${470+i*198}px"><div class="stripe"></div><div class="d"><b>${a}</b><span>${b}</span></div><div class="p ${hi?'hi':''}">${p}</div></div>`);
    s.appendChild(r); A(r,1.0+i*.45,.5,'left',90);
  });
});

/* ---------- 3 deposit ---------- */
scene('s3','teal',T.s3,(s)=>{
  orbs(s);
  const a=el('<div class="abs a">Secure your spot with a</div>'), b=el('<div class="abs b"><span>₦1 Million</span></div>'),
        c=el('<div class="abs c">booking deposit</div>');
  [a,b,c].forEach(x=>s.appendChild(x));
  A(a,.2,.6); A(b.firstChild,.6,.8,'pop'); A(c,1.3,.6);
  anims.push({custom:t=>{const k=1+.03*Math.sin(t*4); b.style.transform=`scale(${k})`;},scene:'s3'});
  b.style.opacity=1;
});

/* ---------- 4 inclusions ---------- */
scene('s4','white',T.s4,(s)=>{
  const h=band(s,'What’s Included','Everything handled for your Umrah');
  A(h.lg,.1,.5,'fade',20);A(h.t,.2,.6);A(h.u,.5,.6,'fade',20);
  const items=[['visa','Umrah Multiple Entry Visa'],['plane','Round Flight Tickets'],['bed','Makkah & Madinah Hotels'],
               ['bus','Ground Transportation'],['pin','Guided Ziyarah Tours'],['cal','Raudah Booking / Visit']];
  items.forEach(([k,l],i)=>{
    const x=60+(i%2)*465, y=470+Math.floor(i/2)*415;
    const c=el(`<div class="inc" style="left:${x}px;top:${y}px"><div class="ic">${svg(k)}</div><p>${l}</p></div>`);
    s.appendChild(c); A(c,.9+i*.4,.5,'pop');
  });
});

/* ---------- 5 hotels ---------- */
scene('s5','white',T.s5,(s)=>{
  const h=band(s,'Our Hotels','Stay close to the Haramain');
  A(h.lg,.1,.5,'fade',20);A(h.t,.2,.6);A(h.u,.5,.6,'fade',20);
  const tag=(txt,y,cls,at)=>{const e=el(`<div class="tag ${cls}" style="top:${y}px">${txt}</div>`);s.appendChild(e);A(e,at,.5,'left',70);};
  const hotel=(txt,y,cls,at)=>{const e=el(`<div class="ht ${cls}" style="top:${y}px"><i>${svg('bed')}</i>${txt}</div>`);s.appendChild(e);A(e,at,.5,'left',90);};
  tag('MADINAH',470,'',.7);
  hotel('Maysan Al Taqwa',570,'',.95); hotel('Plaza Inn Ohud',712,'',1.2);
  tag('MAKKAH',900,'mk',1.7);
  ['Burj Al Balad','Al Kiswah Towers','Nama Al-Asriya','Violet Hotel'].forEach((n,i)=>hotel(n,1000+i*144,'mk',1.95+i*.25));
});

/* ---------- 6 departures ---------- */
scene('s6','teal',T.s6,(s)=>{
  orbs(s);
  const a=el('<div class="abs a">DEPARTURES FROM</div>');
  const cities=el('<div class="abs cities"><span>KANO</span><span>LAGOS</span><span>ABUJA</span></div>');
  const trail=el(`<svg class="trail" viewBox="0 0 1080 620"><path id="route" d="M540 20 C 140 170, 940 330, 540 600" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="4 18" stroke-linecap="round" opacity=".85"/></svg>`);
  const plane=el(`<div id="plane"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>`);
  const dest=el('<div class="abs dest">JEDDAH<small>SAUDI ARABIA</small></div>');
  const urg=el('<div class="abs urg"><span>Slots are limited. Book early!</span></div>');
  [a,cities,trail,dest,urg,plane].forEach(x=>s.appendChild(x));
  A(a,.2,.5,'fade',20); A(cities,.4,.7); A(dest,2.0,.7,'pop'); A(urg.firstChild,2.7,.7,'pop');
  const route=trail.querySelector('#route'), len=route.getTotalLength();
  anims.push({custom:t=>{
    const p=outCubic(prog(t,.9,1.6)); const pt=route.getPointAtLength(len*p);
    const pt2=route.getPointAtLength(Math.min(len,len*p+2));
    const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI+45;   // plane glyph points up-right
    plane.style.opacity=clamp(prog(t,.8,.3)*(1-prog(t,2.4,.4)));
    plane.style.transform=`translate(${pt.x}px,${pt.y+560}px) rotate(${ang}deg)`;
    route.style.strokeDashoffset=-t*30; route.style.opacity=.85*clamp(prog(t,.8,.5));
    urg.style.transform=`scale(${1+.025*Math.sin(t*5)})`;
  },scene:'s6'});
});

/* ---------- 7 contact ---------- */
scene('s7','teal',T.s7,(s)=>{
  orbs(s);
  const lg=el('<div class="abs logo"><img src="assets/logo_white.png"></div>');
  const recap=el('<div class="abs recap"><span class="pill">UMRAH RAMADAN 2027</span></div>');
  const card=el(`<div class="card">
    <div class="crow" id="c1"><div class="ic">${svg('phone')}</div><div><small>CONTACT</small><div class="v">+234 813 122 7047</div></div></div>
    <div class="crow" id="c2"><div class="ic">${svg('mail')}</div><div><small>EMAIL</small><div class="v">contact@hausaly.com</div></div></div>
    <div class="crow" id="c3"><div class="ic">${svg('pin')}</div><div><small>OFFICE</small><div class="v">Bosso Plaza, Along Gombe Road,<br>Biu, Borno, Nigeria</div></div></div></div>`);
  const org=el('<div class="abs org">Hausaly EduTravels Ltd.</div>'), iata=el('<div class="abs iata">IATA No: 96200801 &nbsp;·&nbsp; RC: 8334167</div>');
  [lg,recap,card,org,iata].forEach(x=>s.appendChild(x));
  A(lg,.1,.7); A(recap,.4,.6); A(card,.7,.8,'pop');
  ['#c1','#c2','#c3'].forEach((q,i)=>A(card.querySelector(q),1.2+i*.5,.5,'left',60));
  A(org,2.7,.6); A(iata,3.0,.6,'fade',16);
  anims.push({custom:t=>{const p=prog(t,3.6,2.4);card.querySelector('#c1 .v').style.transform=`scale(${1+.05*Math.sin(p*Math.PI)})`;card.querySelector('#c1 .v').style.transformOrigin='left center';},scene:'s7'});
});

const fade=el('<div id="fade"></div>'); stage.appendChild(fade);

/* ---------- renderer ---------- */
const startOf={}; scenes.forEach(x=>startOf[x.s.id]=x.start);
function render(t){
  scenes.forEach((x,i)=>{
    const next=scenes[i+1]?scenes[i+1].start+0.5:Infinity;
    const vis=t>=x.start&&t<next; x.s.style.visibility=vis?'visible':'hidden';
    const f=i===0?1:outCubic(prog(t,x.start,.5)); x.s.style.opacity=f;
  });
  for(const a of anims){
    if(a.custom){a.custom(t-startOf[a.scene]);continue;}
    const sc=a.e.closest('.scene'); const lt=t-startOf[sc.id];
    const p=prog(lt,a.start,a.dur), o=outCubic(p);
    a.e.style.opacity=p;
    if(a.kind==='up')a.e.style.transform=`translateY(${(1-o)*a.d}px)`;
    else if(a.kind==='left')a.e.style.transform=`translateX(${-(1-o)*a.d}px)`;
    else if(a.kind==='pop')a.e.style.transform=`scale(${.6+.4*outBack(p)})`;
    else a.e.style.transform='none';
  }
  fade.style.opacity=clamp((t-(T.end-.5))/.5);
}
window.render=render;
</script>
</body>
</html>
